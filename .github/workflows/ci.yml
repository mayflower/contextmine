name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Ignore existing BuildKit caches while refreshing them
        required: false
        default: false
        type: boolean
  schedule:
    # Exercise the full cold-cache path weekly, away from the top of the hour.
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  UV_CACHE_DIR: /tmp/.uv-cache
  CONTEXTMINE_SMOKE_COLD_BUILD: ${{ github.event_name == 'schedule' || inputs.cold_cache }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Test system smoke change classifier
        run: ./scripts/ci/test-classify-system-smoke-changes.sh

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty check
        run: uv run ty check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/mayflower/pg4ai:latest@sha256:6489ff6174117b54fa25bebd5bce5c647258f833c1c68ff015e4f7c46f2f7802
        env:
          POSTGRES_USER: contextmine
          POSTGRES_PASSWORD: contextmine
          POSTGRES_DB: contextmine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run migrations
        working-directory: packages/core
        env:
          DATABASE_URL: postgresql+asyncpg://contextmine:contextmine@localhost:5432/contextmine
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://contextmine:contextmine@localhost:5432/contextmine
          DEBUG: "true"
        run: uv run pytest -v

  web:
    name: Web Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Verify generated API client
        run: npm run check:api

      - name: Build web application
        run: npm run build

  web-e2e:
    name: Web End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust Format, Clippy & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/spider_md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  smoke-changes:
    name: Classify System Smoke Changes
    runs-on: ubuntu-latest
    outputs:
      model_free: ${{ steps.classify.outputs.model_free }}
      otel: ${{ steps.classify.outputs.otel }}
      live_web: ${{ steps.classify.outputs.live_web }}
    steps:
      - name: Check out pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            printf 'model_free=false\notel=false\nlive_web=false\n' >>"${GITHUB_OUTPUT}"
            echo "System smokes are selected by the ${GITHUB_EVENT_NAME} schedule, not changed files."
            exit 0
          fi

          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "Pull request base/head SHA is unavailable" >&2
            exit 1
          fi

          changed_files="${RUNNER_TEMP}/contextmine-smoke-changed-files.txt"
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" >"${changed_files}"
          classification="$(./scripts/ci/classify-system-smoke-changes.sh <"${changed_files}")"
          printf '%s\n' "${classification}"
          printf '%s\n' "${classification}" >>"${GITHUB_OUTPUT}"

  model-free-system-smoke:
    name: Model-free System Smoke
    needs: [smoke-changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTEXTMINE_SMOKE_API_IMAGE: contextmine-smoke-api:${{ github.sha }}
      CONTEXTMINE_SMOKE_WORKER_IMAGE: contextmine-smoke-analyzer:${{ github.sha }}
      CONTEXTMINE_SMOKE_USE_PREBUILT_IMAGES: "true"
      RUN_SYSTEM_SMOKE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.smoke-changes.outputs.model_free == 'true') }}
    steps:
      - name: Require successful change classification
        if: needs.smoke-changes.result != 'success'
        run: |
          echo "System smoke change classification did not succeed" >&2
          exit 1

      - name: Record intentional skip
        if: env.RUN_SYSTEM_SMOKE != 'true'
        run: echo "Model-free system smoke is not required for this event and change set."

      - if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached API smoke image
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_API_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-api' }}
          cache-to: type=gha,scope=contextmine-api,mode=max

      - name: Build cached analyzer smoke image
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          target: analyzer
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_WORKER_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-analyzer' }}
          cache-to: type=gha,scope=contextmine-analyzer,mode=max

      - name: Run pinned repository sync gate
        if: env.RUN_SYSTEM_SMOKE == 'true'
        run: ./scripts/smoke/model-free-system.sh

  live-web-smoke:
    name: Live Web Smoke
    needs: [smoke-changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTEXTMINE_SMOKE_API_IMAGE: contextmine-smoke-api:${{ github.sha }}
      CONTEXTMINE_SMOKE_WEB_IMAGE: contextmine-smoke-web:${{ github.sha }}
      CONTEXTMINE_SMOKE_USE_PREBUILT_IMAGES: "true"
      RUN_LIVE_WEB_SMOKE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.smoke-changes.outputs.live_web == 'true') }}
    steps:
      - name: Require successful change classification
        if: needs.smoke-changes.result != 'success'
        run: |
          echo "System smoke change classification did not succeed" >&2
          exit 1

      - name: Record intentional skip
        if: env.RUN_LIVE_WEB_SMOKE != 'true'
        run: echo "Live web smoke is not required for this event and change set."

      - if: env.RUN_LIVE_WEB_SMOKE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        if: env.RUN_LIVE_WEB_SMOKE == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached API smoke image
        if: env.RUN_LIVE_WEB_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_API_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-api' }}
          cache-to: type=gha,scope=contextmine-api,mode=max

      - name: Build cached web smoke image
        if: env.RUN_LIVE_WEB_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_WEB_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-web' }}
          cache-to: type=gha,scope=contextmine-web,mode=max

      - name: Drive the web UI in a real browser
        if: env.RUN_LIVE_WEB_SMOKE == 'true'
        run: ./scripts/smoke/live-web-smoke.sh

  otel-enabled-smoke:
    name: OpenTelemetry Enabled Smoke
    needs: [smoke-changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTEXTMINE_SMOKE_API_IMAGE: contextmine-smoke-api:${{ github.sha }}
      CONTEXTMINE_SMOKE_WORKER_IMAGE: contextmine-smoke-worker:${{ github.sha }}
      CONTEXTMINE_SMOKE_USE_PREBUILT_IMAGES: "true"
      RUN_SYSTEM_SMOKE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.smoke-changes.outputs.otel == 'true') }}
    steps:
      - name: Require successful change classification
        if: needs.smoke-changes.result != 'success'
        run: |
          echo "System smoke change classification did not succeed" >&2
          exit 1

      - name: Record intentional skip
        if: env.RUN_SYSTEM_SMOKE != 'true'
        run: echo "OpenTelemetry system smoke is not required for this event and change set."

      - if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached API smoke image
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_API_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-api' }}
          cache-to: type=gha,scope=contextmine-api,mode=max

      - name: Build cached worker smoke image
        if: env.RUN_SYSTEM_SMOKE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          target: worker
          load: true
          tags: ${{ env.CONTEXTMINE_SMOKE_WORKER_IMAGE }}
          no-cache: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' }}
          cache-from: ${{ env.CONTEXTMINE_SMOKE_COLD_BUILD == 'true' && '' || 'type=gha,scope=contextmine-worker' }}
          cache-to: type=gha,scope=contextmine-worker,mode=max

      - name: Verify exported application telemetry
        if: env.RUN_SYSTEM_SMOKE == 'true'
        run: ./scripts/smoke/otel-enabled.sh

  build:
    name: Build & Push Containers
    runs-on: ubuntu-latest
    needs: [lint, test, web, web-e2e, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: worker
            dockerfile: apps/worker/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: ./apps/web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=contextmine-${{ matrix.name }}
          cache-to: type=gha,scope=contextmine-${{ matrix.name }},mode=max

  helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: helm package deploy/helm/contextmine

      - name: Push Helm chart to GHCR
        run: helm push contextmine-*.tgz oci://ghcr.io/${{ github.repository_owner }}
