# Values for mayflower.gmbh deployment

global:
  imagePullPolicy: IfNotPresent

api:
  image:
    repository: ghcr.io/mayflower/contextmine-api
    tag: sha-35e5920
    digest: sha256:f6e21413d357f3780478ec61cc19ebc44178037e6b79035100842cfb458da00e

worker:
  image:
    repository: ghcr.io/mayflower/contextmine-worker
    tag: sha-35e5920
    digest: sha256:0877bad4fadde65e00436753585d8d9b0c4ad19df5b2b5964b78362445595bf1

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: contextmine.mayflower.gmbh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: contextmine-tls
      hosts:
        - contextmine.mayflower.gmbh

config:
  debug: "false"
  publicBaseUrl: "https://contextmine.mayflower.gmbh"
  mcpOauthBaseUrl: "https://contextmine.mayflower.gmbh"
  mcpAllowedOrigins: "https://claude.ai"

# The production namespace must provide this secret out of band. No production
# credential belongs in a values file committed to the repository.
secrets:
  existingSecret: contextmine-secrets
