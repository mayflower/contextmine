# Default values for ContextMine Helm chart
# This is a YAML-formatted file.

# -- Global settings
global:
  # -- Image pull policy for all containers
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets (if using private registry)
  imagePullSecrets: []

# -- PostgreSQL configuration
postgresql:
  # -- Enable built-in PostgreSQL (set to false for external DB)
  enabled: true
  image:
    repository: ghcr.io/mayflower/pg4ai
    tag: sha-87808a9
    digest: sha256:6489ff6174117b54fa25bebd5bce5c647258f833c1c68ff015e4f7c46f2f7802
  # -- External PostgreSQL configuration (used when enabled: false)
  external:
    host: ""
    port: 5432
  # -- PostgreSQL credentials
  auth:
    username: contextmine
    password: contextmine
    database: contextmine
    # -- Prefect uses a separate database
    prefectDatabase: prefect
  # -- Persistence configuration
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  # -- Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -- API service configuration
api:
  image:
    repository: ghcr.io/mayflower/contextmine-api
    tag: sha-35e5920
    digest: sha256:f6e21413d357f3780478ec61cc19ebc44178037e6b79035100842cfb458da00e
  # -- Number of replicas
  replicaCount: 1
  # -- Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  # -- Service configuration
  service:
    type: ClusterIP
    port: 8000
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}

# -- Prefect server configuration
prefect:
  image:
    repository: prefecthq/prefect
    tag: 3.8.4-python3.14
    digest: sha256:721b957b86d64228350f94a238b9c42d11fd482c74f79e39b54ac2c37be4a907
  # -- Number of replicas (should be 1 for Prefect server)
  replicaCount: 1
  # -- Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Service configuration
  service:
    type: ClusterIP
    port: 4200
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}

# -- Worker configuration
worker:
  image:
    repository: ghcr.io/mayflower/contextmine-worker
    tag: sha-35e5920
    digest: sha256:0877bad4fadde65e00436753585d8d9b0c4ad19df5b2b5964b78362445595bf1
  # -- Number of replicas
  replicaCount: 1
  # -- Resource limits for orchestration and result import
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # -- Persistence for imported analyzer artifacts and crawler data; repositories remain sandboxed
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}

# -- CodeCharta visualization service
codecharta:
  # -- Enable CodeCharta deployment
  enabled: true
  image:
    repository: codecharta/codecharta-visualization
    tag: 1.143.0
    digest: sha256:c72f6ed979dcbaaf4e08289a5c3e34d9c872f564a70ceb4b5252318209f10d35
  # -- Number of replicas
  replicaCount: 1
  # -- Service configuration
  service:
    type: ClusterIP
    port: 80
  # -- Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  ingress:
    # -- Enable dedicated ingress for /codecharta path (requires ingress.enabled=true)
    enabled: true
    # -- Path served by CodeCharta under the main domain
    path: /codecharta
    # -- Ingress path type
    pathType: Prefix
    # -- Extra ingress annotations
    annotations: {}
    # -- Traefik strip-prefix middleware settings (used when ingress.className=traefik)
    stripPrefix:
      enabled: true
      prefixes:
        - /codecharta

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # -- Ingress hosts
  hosts:
    - host: contextmine.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration
  tls: []
  #  - secretName: contextmine-tls
  #    hosts:
  #      - contextmine.local

# -- Application configuration
config:
  # -- Explicit application safety mode
  appMode: "development"
  # -- Debug mode (disable in production)
  debug: "true"
  # -- Public base URL for OAuth callbacks
  publicBaseUrl: "http://localhost:8000"
  # -- MCP OAuth base URL
  mcpOauthBaseUrl: "http://localhost:8000"
  # -- MCP allowed origins (comma-separated, empty = allow all)
  mcpAllowedOrigins: ""
  # -- Default LLM settings
  llm:
    # -- Default embedding model (e.g., openai:text-embedding-3-small)
    defaultEmbeddingModel: ""
    # -- Default LLM provider (openai, anthropic, gemini)
    defaultProvider: ""
    # -- Default LLM model (e.g., gpt-4o-mini)
    defaultModel: ""
  # -- Research agent settings
  research:
    artifactStore: "memory"
    artifactDir: ".mcp_artifacts"
    artifactTtlMinutes: "60"
    artifactMaxRuns: "100"
    model: "claude-sonnet-4-5-20250929"
    maxTokens: "4096"
    budgetSteps: "10"
  # -- Worker sync scheduler settings
  sync:
    # -- Interval for the Prefect due-source dispatcher deployment
    dueIntervalSeconds: "60"
    # -- Maximum concurrent runs handled by the Prefect process worker
    workerLimit: "2"
    # -- Prefect work pool and single-source deployment names
    workPoolName: "contextmine-process"
    deployment: "sync_single_source/default"
    # -- Maximum duration for one source sync run (seconds, 0 disables outer timeout)
    sourceTimeoutSeconds: "0"
  # -- Mayflower Agent Sandbox platform for untrusted repository analysis
  sandbox:
    apiUrl: ""
    analyzerSnapshot: ""
    timeoutSeconds: "3600"
    resultMaxBytes: "67108864"
    artifactMaxBytes: "1073741824"
    vcpus: "2"
    memBytes: "8589934592"
    fsBytes: "21474836480"
  # -- SCIP Polyglot Indexing settings
  scip:
    # -- Comma-separated list of enabled languages
    languages: "python,typescript,javascript,java,php"
    # -- Dependency installation mode: auto, always, never
    installDepsMode: "auto"
    # -- Indexing timeouts per language (seconds)
    timeoutPython: "300"
    timeoutTypescript: "600"
    timeoutJava: "900"
    timeoutPhp: "300"
    # -- Node.js memory limit for TS/JS/Python indexers (MB)
    nodeMemoryMb: "4096"
    # -- Continue indexing if individual projects fail
    bestEffort: "true"
    # -- Fail sync when a detected supported language has no indexed files
    requireLanguageCoverage: "true"
  # -- Real metrics pipeline settings
  metrics:
    # -- Require real LOC/complexity/coupling/coverage for relevant files
    strictMode: "false"
    # -- Comma-separated language scope for metrics extraction
    languages: "python,typescript,javascript,java,php"
    # -- Auto-discover coverage reports when no config patterns match
    autodiscoveryEnabled: "true"

# -- Monitoring configuration
monitoring:
  # -- ServiceMonitor for Prometheus scraping
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # -- PrometheusRule for alerts
  prometheusRule:
    enabled: false
    labels: {}
  # -- Grafana dashboard
  grafana:
    dashboards:
      enabled: false
      label: grafana_dashboard
      folder: ContextMine
  # -- OpenTelemetry configuration
  otel:
    # -- Enable OpenTelemetry instrumentation (traces, metrics, logs)
    enabled: false
    # -- Service name prefix (will be suffixed with -api, -worker)
    serviceName: "contextmine"
    # -- OTLP exporter endpoint (e.g., http://tempo:4317 for gRPC)
    exporterEndpoint: ""
    # -- OTLP protocol: 'grpc' or 'http/protobuf'
    exporterProtocol: "grpc"
    # -- Trace sampler: always_on, always_off, traceidratio, parentbased_traceidratio
    tracesSampler: "parentbased_traceidratio"
    # -- Sampler argument (e.g., 0.1 for 10% sampling)
    tracesSamplerArg: "1.0"
    # -- Minimum log level to export: DEBUG, INFO, WARNING, ERROR
    logLevel: "INFO"
  # -- Grafana Faro configuration (frontend observability)
  faro:
    # -- Enable Faro frontend instrumentation
    enabled: false
    # -- Faro collector URL (e.g., https://faro.example.com/collect)
    collectorUrl: ""

# -- Secrets (set these in your values override or use external secrets)
secrets:
  # -- Use an existing secret instead of creating one (must contain DATABASE_URL, SESSION_SECRET, TOKEN_ENCRYPTION_KEY)
  existingSecret: ""
  # -- GitHub OAuth credentials
  github:
    clientId: ""
    clientSecret: ""
  # -- Security keys (MUST change in production)
  sessionSecret: "dev-session-secret-change-in-production"
  tokenEncryptionKey: "dev-encryption-key-change-in-production"
  # -- LLM provider API keys (optional, at least one recommended)
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  # -- Agent Sandbox platform API credential (required in production)
  sandboxApiKey: ""
