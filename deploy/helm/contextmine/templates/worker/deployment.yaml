apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "contextmine.fullname" . }}-worker
  labels:
    {{- include "contextmine.worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  # Use Recreate strategy to avoid Multi-Attach errors with RWO PVC
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "contextmine.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "contextmine.worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "contextmine.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ['sh', '-c', 'until nc -z {{ include "contextmine.postgresql.host" . }} {{ include "contextmine.postgresql.port" . }}; do echo waiting for postgres; sleep 2; done']
        # Wait for Prefect server to be ready
        - name: wait-for-prefect
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ['sh', '-c', 'until nc -z {{ include "contextmine.fullname" . }}-prefect {{ .Values.prefect.service.port }}; do echo waiting for prefect; sleep 2; done']
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}@{{ .Values.worker.image.digest }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ['/app/.venv/bin/python', '-m', 'contextmine_worker.main']
          envFrom:
            - configMapRef:
                name: {{ include "contextmine.fullname" . }}-config
            - secretRef:
                name: {{ include "contextmine.secretName" . }}
          env:
            # Disable OTEL in worker to prevent subprocess cleanup issues
            - name: OTEL_ENABLED
              value: "false"
            - name: OTEL_SDK_DISABLED
              value: "true"
          volumeMounts:
            {{- if .Values.worker.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- if .Values.worker.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "contextmine.fullname" . }}-worker-data
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
