[project]
name = "contextmine-core"
version = "0.1.0"
description = "Shared core library for ContextMine"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "alembic>=1.19.1",
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "google-genai>=2.21.0",
    "tenacity>=9.1.4",
    # LangChain for LLM abstraction (stable 1.x)
    "langchain-core>=1.4.8",
    "langchain-anthropic>=1.4.7",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]>=3.3.5",
    "claude-agent-sdk==0.2.149",
    # SCIP protobuf parsing for code intelligence
    "protobuf>=7.36.1",
    "lizard>=1.24.0",
    # Tree-sitter for AST-based analysis (rule extraction, outline)
    "tree-sitter-language-pack>=1.15.8",
    # Deterministic community detection for the knowledge graph
    "numpy>=2.5.2",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    # OpenTelemetry (optional - only imports when OTEL_ENABLED=true)
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
lsp = [
    "multilspy @ git+https://github.com/microsoft/multilspy@6f4c0b7c287f2ff6917fc4008ba0d98a26d6aa24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["contextmine_core"]
