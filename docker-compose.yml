services:
  postgres:
    image: ghcr.io/mayflower/pg4ai:sha-87808a9@sha256:6489ff6174117b54fa25bebd5bce5c647258f833c1c68ff015e4f7c46f2f7802
    platform: ${POSTGRES_PLATFORM:-linux/amd64}
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: contextmine
      POSTGRES_PASSWORD: contextmine
      POSTGRES_DB: contextmine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextmine -d contextmine"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8111:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for Docker network
      - DATABASE_URL=postgresql+asyncpg://contextmine:contextmine@postgres:5432/contextmine
      # Prefect's run_deployment() reads the server from this environment
      # variable, not from Settings.prefect_api_url. Without it the SDK falls
      # back to an ephemeral local server and every sync-now fails to schedule.
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      # Mount source for development hot reload
      - ./packages:/app/packages:ro
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  codecharta:
    image: codecharta/codecharta-visualization:1.143.0@sha256:c72f6ed979dcbaaf4e08289a5c3e34d9c872f564a70ceb4b5252318209f10d35
    ports:
      - "${CODECHARTA_PORT:-9001}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prefect stack
  prefect-server:
    image: prefecthq/prefect:3.8.4-python3.14@sha256:721b957b86d64228350f94a238b9c42d11fd482c74f79e39b54ac2c37be4a907
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://contextmine:contextmine@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      # Override for Docker network
      DATABASE_URL: postgresql+asyncpg://contextmine:contextmine@postgres:5432/contextmine
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      # Mount source for development hot reload
      - ./packages:/app/packages:ro
      - ./apps/worker:/app/apps/worker:ro
      # Persistent imported analyzer artifacts and crawl cache
      - worker_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  # Optional: OpenTelemetry Collector for local development
  # Start with: docker compose --profile otel up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    profiles: ["otel"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "55679:55679" # zpages (debugging)
    volumes:
      - ./scripts/docker/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  worker_data:
